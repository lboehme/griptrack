# GripTrack on an Oracle Always Free Tier VM: the app container plus Caddy
# as the TLS terminator (Let's Encrypt, automatic). Run by scripts/
# oracle-deploy with --env-file /opt/griptrack/.env — every ${VAR} below is
# substituted from that file, so the .env is the single place configuration
# lives (see .env.example plus GRIPTRACK_DOMAIN).
services:
  app:
    build:
      # Compose resolves this relative to this file: deploy/oracle -> repo root.
      context: ../..
    restart: unless-stopped
    environment:
      GRIPTRACK_ENV: ${GRIPTRACK_ENV:-production}
      GRIPTRACK_SESSION_SECRET: ${GRIPTRACK_SESSION_SECRET:?set in /opt/griptrack/.env}
      GRIPTRACK_DATABASE_URL: ${GRIPTRACK_DATABASE_URL:-sqlite:////data/griptrack.db}
      # Empty is valid: set it for the first deploy, blank it after the
      # admin account exists (see docs/deployment.md).
      GRIPTRACK_BOOTSTRAP_TOKEN: ${GRIPTRACK_BOOTSTRAP_TOKEN:-}
    volumes:
      # The whole dataset is this one directory (SQLite file + pre-migration
      # backups). A bind mount, not a named volume, so backup/restore is
      # plain file access on the VM.
      - /opt/griptrack/data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GRIPTRACK_DOMAIN: ${GRIPTRACK_DOMAIN:?set in /opt/griptrack/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state — must persist across restarts
      # or Let's Encrypt rate limits will eventually lock cert issuance out.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
