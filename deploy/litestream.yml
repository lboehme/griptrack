# Litestream replication config (issue #29) — baked into the image at
# /etc/litestream.yml. Values come from env vars at runtime (Litestream
# expands ${...}); docker-entrypoint.sh only engages Litestream when
# GRIPTRACK_REPLICA_BUCKET is set, so a container without backup config
# runs exactly as before.
#
# GRIPTRACK_DB_PATH is exported by the entrypoint (derived from
# GRIPTRACK_DATABASE_URL, single source of truth). Credentials come from
# Litestream's native env vars: LITESTREAM_ACCESS_KEY_ID and
# LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: ${GRIPTRACK_DB_PATH}
    replica:
      type: s3
      bucket: ${GRIPTRACK_REPLICA_BUCKET}
      path: griptrack
      endpoint: ${GRIPTRACK_REPLICA_ENDPOINT}
      region: ${GRIPTRACK_REPLICA_REGION}
