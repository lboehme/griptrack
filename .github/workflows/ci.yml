name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The suite builds its schema from SQLModel.metadata.create_all, so it
      # does NOT exercise the Alembic migrations — the migration gates do.
      # Both steps run the same scripts used locally, so CI and dev can't drift.
      - name: Run tests
        run: scripts/test

      # Gate 1 (upgrade from scratch) + gate 2 (models/migrations lockstep).
      - name: Migration gates
        run: scripts/check-migrations
