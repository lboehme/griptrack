name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The suite builds its schema from SQLModel.metadata.create_all, so it
      # does NOT exercise the Alembic migrations — the two gates below do.
      - name: Run tests
        run: pytest

      # Gate 1: every migration applies cleanly against a fresh SQLite DB
      # (catches broken/half-written migrations before they hit the prod volume).
      - name: Migrations apply from scratch
        env:
          GRIPTRACK_DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head

      # Gate 2: models and migrations are in lockstep — fails if a model changed
      # without a matching migration (the discipline CLAUDE.md calls for).
      - name: Models & migrations in sync
        env:
          GRIPTRACK_DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic check
