name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The suite builds its schema from SQLModel.metadata.create_all, so it
      # does NOT exercise the Alembic migrations — the migration gates do.
      # Both steps run the same scripts used locally, so CI and dev can't drift.
      - name: Run tests
        run: scripts/test

      # Gate 1 (upgrade from scratch) + gate 2 (models/migrations lockstep).
      - name: Migration gates
        run: scripts/check-migrations

      # ruff (lint) + mypy (types) + pip-audit (dependency vulnerabilities),
      # same script used locally, so CI and dev can't drift.
      - name: Lint, type-check, and dependency audit
        run: scripts/lint

      # Distinct step so a flaky/slow browser install can't affect the
      # fast suite or lint gates above. Unlike local dev containers (see
      # scripts/test-browser), this runner has no pre-provisioned browser,
      # so it installs the exact Chromium build pytest-playwright expects.
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Browser smoke suite
        run: scripts/test-browser
