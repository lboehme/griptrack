# fly.toml app configuration file generated for griptrack on 2026-07-06T09:50:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'griptrack'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "griptrack_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

