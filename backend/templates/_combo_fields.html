{# The (grip, edge, date, hand, session_number) a session-page form posts
   back — expects `grip`, `edge_mm`, `date`, `session_number` and a
   loop-local `hand` in context. #}
<input type="hidden" name="grip_type_id" value="{{ grip.id }}">
<input type="hidden" name="edge_mm" value="{{ edge_mm }}">
<input type="hidden" name="date" value="{{ date }}">
<input type="hidden" name="hand" value="{{ hand }}">
{% if session_number %}<input type="hidden" name="session_number" value="{{ session_number }}">{% endif %}
