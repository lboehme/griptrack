{% extends "base.html" %}
{% block title %}Log in — GripTrack{% endblock %}
{% block content %}
<div class="auth-wrap">
  <p class="brand">GripTrack<span style="color:var(--accent)">.</span></p>
  <div class="card">
    <form method="post" action="/login">
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
    </form>
  </div>
  <p class="auth-alt">Got an invite? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
